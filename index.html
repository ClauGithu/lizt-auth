<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lizt — Verificación</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f0f1a; font-family: 'Segoe UI', system-ui, sans-serif; }
    .card { background: #1a1a2e; border: 1px solid #2a2a45; border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 420px; box-shadow: 0 24px 60px rgba(0,0,0,0.4); text-align: center; }
    .logo h1 { font-size: 2.4rem; font-weight: 800; color: #c9a84c; letter-spacing: -1px; margin-bottom: 4px; }
    .logo p { color: #8888aa; font-size: 0.9rem; margin-bottom: 36px; }
    .lock-icon { font-size: 2.4rem; margin-bottom: 16px; }
    h2 { color: #ffffff; font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
    .subtitle { color: #8888aa; font-size: 0.92rem; line-height: 1.6; margin-bottom: 8px; }
    .note { color: #555577; font-size: 0.82rem; margin-bottom: 20px; line-height: 1.5; }
    input[type="email"] { width: 100%; padding: 12px 16px; background: #0f0f1a; border: 1px solid #2a2a45; border-radius: 8px; color: #fff; font-size: 0.95rem; margin-bottom: 16px; outline: none; transition: border-color 0.2s; }
    input[type="email"]:focus { border-color: #c9a84c; }
    .btn-primary { width: 100%; padding: 13px; background: #c9a84c; color: #0f0f1a; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-bottom: 16px; }
    .btn-primary:hover { background: #d4b660; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .otp-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
    .otp-group input { width: 48px; height: 56px; text-align: center; font-size: 1.4rem; font-weight: 700; background: #0f0f1a; border: 1px solid #2a2a45; border-radius: 8px; color: #fff; outline: none; transition: border-color 0.2s; }
    .otp-group input:focus { border-color: #c9a84c; }
    .resend-btn { background: none; border: none; border-bottom: 1px dashed #444466; color: #8888aa; font-size: 0.82rem; cursor: pointer; padding: 0; }
    .resend-btn:hover { color: #c9a84c; }
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 16px; }
    .alert-error { background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.3); color: #ff6b7a; }
    .alert-success { background: rgba(40,167,69,0.15); border: 1px solid rgba(40,167,69,0.3); color: #5dd879; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><h1>Lizt</h1><p>Contenido inmobiliario con IA</p></div>

    <div id="screen-send">
      <div class="lock-icon">🔐</div>
      <h2>Casi listo</h2>
      <p class="subtitle">Para abrir Lizt por primera vez verificamos tu cuenta.<br>Te mandamos un código a</p>
      <p style="color:#c9a84c;font-weight:600;margin:8px 0 12px;" id="display-email">tu correo registrado</p>
      <p class="note">Solo toma un segundo.</p>
      <div id="alert-send" class="hidden alert"></div>
      <input type="email" id="email-input" placeholder="tu@correo.com" style="display:none;" />
      <button class="btn-primary" id="btn-send" onclick="sendCode()">Enviar mi código →</button>
    </div>

    <div id="screen-verify" class="hidden">
      <div class="lock-icon">📨</div>
      <h2>Revisa tu correo</h2>
      <p class="subtitle" style="margin-bottom:24px;">Ingresa el código de 6 dígitos enviado a <span style="color:#c9a84c;font-weight:600;" id="display-email-2"></span></p>
      <div id="alert-verify" class="hidden alert"></div>
      <div class="otp-group" id="otp-inputs">
        <input type="text" maxlength="1" inputmode="numeric" />
        <input type="text" maxlength="1" inputmode="numeric" />
        <input type="text" maxlength="1" inputmode="numeric" />
        <input type="text" maxlength="1" inputmode="numeric" />
        <input type="text" maxlength="1" inputmode="numeric" />
        <input type="text" maxlength="1" inputmode="numeric" />
      </div>
      <button class="btn-primary" id="btn-verify" onclick="verifyCode()">Verificar y entrar →</button>
      <button class="resend-btn" onclick="showSendScreen()">¿No llegó? Reenviar código</button>
    </div>
  </div>

  <script>
    const API = 'https://tool.lizt.us';
    let userEmail = '';

    function getEmail() {
      const p = new URLSearchParams(window.location.search);
      if (p.get('email')) return decodeURIComponent(p.get('email'));
      return '';
    }

    function init() {
      userEmail = getEmail();
      if (userEmail) {
        document.getElementById('display-email').textContent = userEmail;
        document.getElementById('display-email-2').textContent = userEmail;
      } else {
        document.getElementById('email-input').style.display = 'block';
        document.getElementById('display-email').style.display = 'none';
      }
    }

    function showAlert(id, msg, type) {
      const el = document.getElementById('alert-' + id);
      el.className = 'alert alert-' + type;
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    async function sendCode() {
      if (!userEmail) {
        userEmail = document.getElementById('email-input').value.trim().toLowerCase();
        if (!userEmail) { showAlert('send', 'Ingresa tu correo.', 'error'); return; }
        document.getElementById('display-email-2').textContent = userEmail;
      }
      const btn = document.getElementById('btn-send');
      btn.disabled = true; btn.textContent = 'Enviando...';
      try {
        const res = await fetch(API + '/auth/send-otp', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email: userEmail })
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('screen-send').classList.add('hidden');
          document.getElementById('screen-verify').classList.remove('hidden');
          document.getElementById('otp-inputs').querySelectorAll('input')[0].focus();
        } else {
          showAlert('send', data.detail || 'Error al enviar el código.', 'error');
          btn.disabled = false; btn.textContent = 'Enviar mi código →';
        }
      } catch(e) {
        showAlert('send', 'Error de conexión. Intenta de nuevo.', 'error');
        btn.disabled = false; btn.textContent = 'Enviar mi código →';
      }
    }

    async function verifyCode() {
      const inputs = document.getElementById('otp-inputs').querySelectorAll('input');
      const code = Array.from(inputs).map(i => i.value).join('');
      if (code.length < 6) { showAlert('verify', 'Ingresa los 6 dígitos.', 'error'); return; }
      const btn = document.getElementById('btn-verify');
      btn.disabled = true; btn.textContent = 'Verificando...';
      try {
        const res = await fetch(API + '/auth/verify-otp', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email: userEmail, code: code })
        });
        const data = await res.json();
        if (res.ok && data.token) {
          showAlert('verify', '¡Verificado! Abriendo Lizt...', 'success');
          setTimeout(() => { window.location.href = API + '?token=' + data.token; }, 800);
        } else {
          showAlert('verify', data.detail || 'Código incorrecto.', 'error');
          btn.disabled = false; btn.textContent = 'Verificar y entrar →';
        }
      } catch(e) {
        showAlert('verify', 'Error de conexión. Intenta de nuevo.', 'error');
        btn.disabled = false; btn.textContent = 'Verificar y entrar →';
      }
    }

    function showSendScreen() {
      document.getElementById('screen-verify').classList.add('hidden');
      document.getElementById('screen-send').classList.remove('hidden');
      document.getElementById('btn-send').disabled = false;
      document.getElementById('btn-send').textContent = 'Enviar mi código →';
    }

    document.addEventListener('DOMContentLoaded', function() {
      init();
      const inputs = document.getElementById('otp-inputs').querySelectorAll('input');
      inputs.forEach((inp, i) => {
        inp.addEventListener('input', () => { if (inp.value && i < inputs.length-1) inputs[i+1].focus(); });
        inp.addEventListener('keydown', (e) => { if (e.key==='Backspace' && !inp.value && i>0) inputs[i-1].focus(); });
      });
    });
  </script>
</body>
</html>
